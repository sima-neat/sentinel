name: Vulcan CI

run-name: Publish Sentinel package from ${{ github.ref_name }}

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  resolve-vulcan-config:
    name: Resolve Vulcan Config
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ vars.VULCAN_ENV || 'production' }}

  package:
    name: Package Sentinel
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:1-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            file \
            python3 \
            python3-pip \
            python3-venv \
            sudo

      - name: Install sima-cli
        run: |
          set -euo pipefail
          curl -fsSL https://docs.sima.ai/_static/tools/sima-cli-installer.sh | bash
          echo "${HOME}/.sima-cli/.venv/bin" >> "${GITHUB_PATH}"
          "${HOME}/.sima-cli/.venv/bin/sima-cli" --version
          "${HOME}/.sima-cli/.venv/bin/sima-cli" packages build --help >/dev/null

      - name: Validate package
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --check
          cargo check --locked

      - name: Build binary and Vulcan metadata
        run: |
          set -euo pipefail
          scripts/build_vulcan_package.sh

      - name: Verify package payload
        run: |
          set -euo pipefail
          test -f dist/sentinel/metadata.json
          test -f dist/sentinel/install.sh
          test -f dist/sentinel/simaai-sentinel
          test -f dist/sentinel/simaai-sentinel.service
          file dist/sentinel/simaai-sentinel
          python3 -m json.tool dist/sentinel/metadata.json >/dev/null
          grep -q "simaai-sentinel" dist/sentinel/simaai-sentinel.service
          ls -lh dist/sentinel

      - name: Upload Sentinel package
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-package
          path: dist/sentinel/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish Sentinel to Vulcan
    needs:
      - resolve-vulcan-config
      - package
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-vulcan-config.outputs.artifact_cloudfront_distribution_id }}
      artifact_folder: ""
      artifact_pattern: sentinel-package
      artifact_glob: "*"
      min_artifact_count: 4
      publish_manifest: true

  update-latest:
    name: Update Vulcan Latest Tag
    needs:
      - resolve-vulcan-config
      - publish
    uses: sima-neat/.github/.github/workflows/vulcan-update-latest-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      artifact_folder: ""
      validate_manifest: true
