[package]
name = "simaai-sentinel"
version = "0.1.0"
edition = "2021"
description = "SiMa.ai Modalix board metrics monitoring daemon and CLI."
license = "Proprietary"

[[bin]]
name = "simaai-sentinel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ctrlc = "3"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
